telegram:
  bot_token: "YOUR_BOT_TOKEN_HERE"
  chat_id: "YOUR_CHAT_ID_HERE"

# 감시할 극장 목록 (기본: 용산아이파크몰, 천호)
# min_alert_seats: 남은 좌석이 이 값 이하이면 알림을 보내지 않음 (장애인석 등 실질적으로 예매 불가한 잔여석 필터링)
theaters:
  - name: "CGV 용산아이파크몰"
    site_no: "0013"
    min_alert_seats: 6
  - name: "CGV 천호"
    site_no: "0199"
    min_alert_seats: 4

# 감시할 상영관 종류 (상영관 이름에 아래 키워드가 포함되면 감시 대상)
# 예: ["IMAX"] -> IMAX관만, ["IMAX", "SCREENX"] -> IMAX와 SCREENX 모두
screens:
  - "IMAX"

# 감시할 영화 제목 키워드 (비워두면 모든 영화의 신규 상영을 감지)
# 예: movies: ["아바타", "듄"]
movies: []

# 취소표 확인 주기 (초). 이미 감시 중인 회차(active_dates)만 빠르게 재확인하는 거라
# 요청이 적어서 짧게 잡아도 비교적 안전합니다. 취소표는 순식간에 다른 사람이 잡아가니 짧게 유지하세요.
# (요청 사이에는 별도로 0.4~1초 랜덤 딜레이가 자동으로 들어갑니다.)
cancel_check_interval_sec: 8

# 취소표 재확인 시 동시에 조회할 날짜 수 (병렬 요청). 감시 중인 날짜가 많아질수록 한 바퀴 도는 데
# 걸리는 시간이 늘어나는데, 이 값을 늘리면 그만큼 빨리 도는 대신 순간 요청이 몰려
# 비정상 접속으로 차단될 위험도 커집니다. 3~5 정도를 권장합니다.
cancel_max_workers: 4

# 예매 가능한 전체 기간을 다시 훑어서 놓친 신규 상영(오픈)이 없는지 확인하는 주기 (초)
# 날짜를 전부 한 번에 순차 조회하지 않고, 이 주기마다 full_scan_chunk_size개씩만 순환하며 훑습니다.
# (그래야 한 사이클이 길어져서 취소표 감시가 지연되는 일이 없습니다.)
full_scan_interval_sec: 30

# 전체 재검사 시 한 번에 훑을 날짜 개수 (나머지는 다음 주기로 넘어가서 이어서 훑음)
# 너무 크게 잡으면 그 순간 요청이 몰려서 비정상 접속으로 차단될 위험이 커집니다.
full_scan_chunk_size: 10

# 빨간 날(토, 일, 공휴일, 대체공휴일)이 아닌 평일에는 이 시각 이후 상영만 감시 (HHMM, 예: "1800" = 18:00)
weekday_start_time: "1800"

# 공휴일 / 대체공휴일 목록 (YYYYMMDD). 매년 갱신 필요.
holidays:
  - "20260101"  # 신정
  - "20260216"  # 설날 연휴
  - "20260217"  # 설날
  - "20260218"  # 설날 연휴
  - "20260301"  # 삼일절
  - "20260302"  # 대체공휴일(삼일절)
  - "20260505"  # 어린이날
  - "20260524"  # 부처님오신날
  - "20260525"  # 대체공휴일(부처님오신날)
  - "20260603"  # 제9회 전국동시지방선거(임시공휴일)
  - "20260606"  # 현충일
  - "20260815"  # 광복절
  - "20260817"  # 대체공휴일(광복절)
  - "20260924"  # 추석 연휴
  - "20260925"  # 추석
  - "20260926"  # 추석 연휴
  - "20261003"  # 개천절
  - "20261005"  # 대체공휴일(개천절)
  - "20261009"  # 한글날
  - "20261225"  # 성탄절
